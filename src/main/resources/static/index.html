<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Eron Directors Demo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            body {
                font-family: system-ui, Arial, sans-serif;
                max-width: 720px;
                margin: 2rem auto;
                padding: 0 1rem;
            }

            input,
            button {
                font-size: 1rem;
                padding: 0.5rem 0.75rem;
            }

            pre {
                background: #f6f8fa;
                padding: 1rem;
                overflow: auto;
                border-radius: 8px;
            }

            .row {
                display: flex;
                gap: 0.5rem;
                align-items: center;
            }
        </style>
    </head>

    <body>
        <h1>Directors API</h1>
        <div class="row">
            <label for="th">threshold:</label>
            <input id="th" type="number" min="0" value="4" />
            <button id="btn">Query</button>
        </div>
        <h2>Response</h2>
        <pre id="out">Click "Query"…</pre>

        <script>
            const $ = s => document.querySelector(s);
            $('#btn').addEventListener('click', async () => {
                const th = Number($('#th').value || 0);
                $('#out').textContent = 'Loading…';
                try {
                    const res = await fetch(
                        `/api/directors?threshold=${encodeURIComponent(th)}`
                    );
                    const text = await res.text();
                    $('#out').textContent = text;
                } catch (e) {
                    $('#out').textContent =
                        'Error: ' + (e && e.message ? e.message : e);
                }
            });
        </script>
    </body>
</html>
